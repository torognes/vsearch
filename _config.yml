remote_theme: just-the-docs/just-the-docs@v0.12.0

# shown in the sidebar header and in the browser tab
title: vsearch manual
description: >-
  Manual pages for vsearch, a versatile open-source tool for metabarcoding
  and metagenomics.

# attempt to fix lack of CSS rendering in deployed mode
baseurl: /vsearch
url: https://torognes.github.io

# keep literal double-hyphens in option names (e.g. --cluster_size)
# instead of letting kramdown turn them into en-dashes
kramdown:
  typographic_symbols:
    ndash: "--"
    mdash: "---"

plugins:
  - jekyll-relative-links
  - jekyll-remote-theme
  # required by the just-the-docs layouts, which call {% seo %} and
  # {% include_cached %}: with a remote theme the plugins it depends on
  # have to be listed here, or the build fails on an unknown tag. Both
  # are supported by GitHub Pages (see pages.github.com/versions.json).
  - jekyll-seo-tag
  - jekyll-include-cache
relative_links:
  enabled: true
  collections: true
include:
  - CONTRIBUTING.md
  - README.md
  - LICENSE.md
  - COPYING.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - ISSUE_TEMPLATE.md
  - PULL_REQUEST_TEMPLATE.md

# Jekyll does not merge a theme's own _config.yml into the site, so the
# layout that every just-the-docs page needs has to be declared here.
# Without it the pages are emitted as bare markdown conversions, with no
# sidebar, no header and no <title>.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# just-the-docs settings. The navigation itself is not configured here:
# each generated page declares its own title and its section in the YAML
# front matter written by man/scripts/generate_online_documentation.sh.
color_scheme: light
search_enabled: true
heading_anchors: true
aux_links:
  vsearch on GitHub:
    - https://github.com/torognes/vsearch
aux_links_new_tab: true
