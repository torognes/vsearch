# Build and deploy the vsearch manual to GitHub Pages.
#
# The site holds several manuals, because the one people are pointed to
# must describe the vsearch they actually have: every installed copy
# names https://torognes.github.io/vsearch/ in the AVAILABILITY section
# of its manual pages, and a site built from dev would answer them with
# options and defaults no release has yet.
#
#   https://torognes.github.io/vsearch/          the released manual, master
#   https://torognes.github.io/vsearch/dev/      the development manual, dev
#   https://torognes.github.io/vsearch/<tag>/    one archived release per tag
#
# The archived manuals answer the other half of the same problem: a
# reader still running an older vsearch follows the address their own
# manual pages name and lands on a manual describing a release they do
# not have. The releases to publish are listed in man/versions.txt.
#
# GitHub Pages serves one site per repository, so these are folders of a
# single site rather than separate deployments. That is why this workflow
# checks out both branches on every run, whichever one was pushed, and
# rebuilds every archived manual as well: each deployment replaces the
# whole site, so a run that rebuilt only the pushed branch would erase
# everything else.
#
# Which file runs is decided by the branch that was pushed, so this
# workflow has to exist on master as well as on dev to do its job. Until
# it reaches master -- it travels there with the 2.32.0 merge -- a push to
# master still runs master's own copy. The guard below covers the other
# half of that window.
name: Deploy the manual to GitHub Pages

on:
  # Either manual can change, and either change has to be published
  push:
    branches: ["master", "dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Which releases have an archived manual. A matrix cannot be built
  # from a file, so the list has to be read by a job of its own and
  # handed on as JSON.
  #
  # The list is read from master, and so is the generator that builds
  # the archived manuals below. Both belong to the deployment rather
  # than to any tag -- a tag cannot know about the versions published
  # after it, and the tags predating this feature have a generator that
  # does not know the "version" channel. Taking both from master also
  # means the archive and the version index pointing at it appear
  # together: until this reaches master, man/versions.txt is not there,
  # this job reports none, and the site is exactly what it was before.
  versions:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.read.outputs.tags }}
      any: ${{ steps.read.outputs.any }}
    steps:
      - name: Check out the released manual
        uses: actions/checkout@v6
        with:
          ref: master
          path: released
      - name: Read the list of published versions
        id: read
        run: |
          set -euo pipefail
          if [ ! -r released/man/versions.txt ] ; then
            echo "master carries no man/versions.txt yet: no archived manual to publish."
            echo "tags=[]" >> "${GITHUB_OUTPUT}"
            echo "any=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # the generator answers for the format of the file it owns, so
          # that this workflow does not carry a second parser free to
          # drift from it
          tags="$(cd released/man && bash ./scripts/generate_online_documentation.sh --versions)"
          json="$(printf '%s\n' "${tags}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "tags=${json}" >> "${GITHUB_OUTPUT}"
          if [ "${json}" = "[]" ] ; then
            echo "any=false" >> "${GITHUB_OUTPUT}"
          else
            echo "any=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "archived manuals to build: ${json}"

  # One archived manual per listed release, each its own Jekyll site.
  #
  # They are built here rather than in the build job below because
  # actions/jekyll-build-pages is a "uses" step, and a "uses" step cannot
  # be run once per entry of a list. A matrix can, it uses the very same
  # action the two branch manuals are built with -- rather than a
  # hand-rolled jekyll invocation that could render them differently --
  # and the legs run in parallel, so the wall-clock cost of the archive
  # does not grow with every release.
  archived:
    needs: versions
    if: needs.versions.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # one broken tag should not hide whether the others are fine
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.versions.outputs.tags) }}
    steps:
      - name: Check out the generator
        uses: actions/checkout@v6
        with:
          ref: master
          path: released
      - name: Check out the archived release
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.tag }}
          path: archive
      # the per-version half of the check the released manual gets in the
      # build job: a tag from before the modular toolchain would publish
      # a folder that looks nothing like the rest of the site, and would
      # do it without failing
      - name: Check the tag against the modular toolchain
        run: |
          grep -q 'just-the-docs' archive/_config.yml || {
            echo "::error::${{ matrix.tag }} predates the modular manual toolchain."
            echo "::error::v2.32.0 is the oldest release that can be published; see man/versions.txt."
            exit 1
          }
      - name: Install pandoc
        run: |
          sudo apt update
          sudo apt install -y pandoc
      # Only man/scripts/ is overlaid. The tag keeps its own _config.yml,
      # and with it the theme version its release was published with, so
      # what is rebuilt is that release's manual and not its rendering.
      - name: Generate the archived manual
        run: |
          set -euo pipefail
          rm -rf archive/man/scripts
          cp -a released/man/scripts archive/man/scripts
          cd archive/man
          bash ./scripts/generate_online_documentation.sh version "${{ matrix.tag }}"
      - name: Build the archived manual
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./archive/docs
          destination: ./_site
      - name: Upload the archived manual
        uses: actions/upload-artifact@v4
        with:
          name: archived-${{ matrix.tag }}
          path: ./_site
          retention-days: 1

  # Build job
  build:
    needs: [versions, archived]
    # the archived job is skipped when nothing is listed, and a skipped
    # dependency would otherwise skip this job with it
    if: >-
      always() && needs.versions.result == 'success'
      && needs.archived.result != 'failure'
      && needs.archived.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released manual
        uses: actions/checkout@v6
        with:
          ref: master
          path: released
      - name: Check out the development manual
        uses: actions/checkout@v6
        with:
          ref: dev
          path: development
      - name: Install pandoc
        run: |
          sudo apt update
          sudo apt install -y pandoc
      - name: Generate the released manual
        working-directory: ./released/man
        run: bash ./scripts/generate_online_documentation.sh released
      - name: Generate the development manual
        working-directory: ./development/man
        run: bash ./scripts/generate_online_documentation.sh development
      # master carried an older manual toolchain until the 2.32.0 merge:
      # the hacker theme, pandoc without +definition_lists, and pages with
      # no YAML front matter, hence no sidebar and no search. Publishing
      # that output would not fail, it would quietly replace the themed
      # site with the old rendering, so check for it and stop instead.
      - name: Check the released manual against the modular toolchain
        run: |
          fault=""
          head -1 released/docs/index.md | grep -q '^---$' \
            || fault="the pages carry no YAML front matter"
          grep -q 'just-the-docs' released/docs/_config.yml \
            || fault="the configuration does not name just-the-docs"
          if [ -n "${fault}" ] ; then
            echo "::error::The released manual built from master is not the modular one: ${fault}."
            echo "::error::Publishing it would replace the themed site with the pre-2.32.0 rendering."
            echo "::error::Merge dev into master, then re-run this workflow."
            exit 1
          fi
          echo "released: $(find released/docs -name '*.md' | wc -l) pages"
          echo "development: $(find development/docs -name '*.md' | wc -l) pages"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # Order matters: jekyll empties the folder it builds into, so the
      # released manual has to be built before the development manual is
      # placed inside it. The reverse order deletes the development half.
      - name: Build the released manual
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./released/docs
          destination: ./_site
      - name: Build the development manual
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./development/docs
          destination: ./_site/dev
      # For the same reason the two builds above are ordered: the
      # archived manuals are placed into _site only once nothing is
      # going to empty it again. They are copied rather than built,
      # having been built by the archived job.
      - name: Collect the archived manuals
        if: needs.versions.outputs.any == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: archived-*
          path: ./archived
      - name: Place the archived manuals in the site
        if: needs.versions.outputs.any == 'true'
        run: |
          set -euo pipefail
          for folder in ./archived/archived-* ; do
            tag="${folder##*/archived-}"
            mkdir -p "_site/${tag}"
            cp -a "${folder}/." "_site/${tag}/"
            echo "${tag}: $(find "_site/${tag}" -name '*.html' | wc -l) pages"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
