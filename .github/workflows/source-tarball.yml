name: Source distribution

# Builds the source distribution, proves it is buildable on its own, and
# attaches it to the GitHub release.
#
# It exists because the tarball GitHub generates by itself (the "Source code
# (tar.gz)" link, a plain snapshot of the git tree) carries neither the
# generated manual pages nor NEWS, and carries a good deal of development
# scaffolding that a reader of the source has no use for. The tarball built
# here is the one to point people at: 'make dist' adds the 63 manual pages
# and NEWS, and drops everything .gitattributes marks export-ignore, so it
# builds with nothing but a C++ compiler and GNU make -- no pandoc, and no
# git either, although 'make dist' itself needs one.
#
# The build system is now four hand-written Makefiles, so there is no
# generator to pin and no rebuild rules that could fire on a consumer's
# machine. What the verify job below still has to prove is the other half of
# that promise: that the tarball is complete (the manual is in it) and that
# nothing in it reaches for a tool the tarball's own README does not ask
# for.

on:
  release:
    types: [published]
  # A manual run builds and verifies the tarball without touching any
  # release. Give it a tag to attach the result to a release that already
  # exists -- the first release made under this workflow, or a re-run after
  # a failure.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the tarball to (leave empty to only build it)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    name: Build the tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # pandoc generates the manual pages and NEWS. 'make dist' ships both, and
    # the dist-hook in Makefile.am refuses to build a distribution missing
    # either, so this is a hard requirement here -- and only here.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make pandoc libbz2-dev zlib1g-dev

    # Recorded so a tarball can be traced back to the toolchain that made it.
    - name: Record the toolchain
      run: |
        make --version | head -n 1
        pandoc --version | head -n 1

    - name: Build the distribution
      run: |
        make dist
        # 'make dist' writes into dist/; move it to the workspace root, which
        # is where the verify and publish jobs expect to find it.
        mv dist/vsearch-*.tar.gz .

    # A release tag that disagrees with VERSION means the version bump
    # was forgotten, and every artefact of the release would carry the old
    # number. Catch it here rather than in a user's bug report.
    - name: Check the version
      run: |
        version=$(cat VERSION)
        echo "VERSION declares ${version}"
        test -f "vsearch-${version}.tar.gz"
        if [ "${{ github.event_name }}" = "release" ] ; then
          tag="${{ github.event.release.tag_name }}"
          if [ "${tag}" != "v${version}" ] ; then
            echo "::error::release tag ${tag} does not match VERSION (${version})" >&2
            exit 1
          fi
        fi
        sha256sum "vsearch-${version}.tar.gz" | tee "vsearch-${version}.tar.gz.sha256"

    - name: Upload the tarball
      uses: actions/upload-artifact@v7
      with:
        name: source-distribution
        path: |
          vsearch-*.tar.gz
          vsearch-*.tar.gz.sha256

  verify:
    name: Build it with nothing but a compiler
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Download the tarball
      uses: actions/download-artifact@v7
      with:
        name: source-distribution

    # Deliberately no pandoc: this job stands in for a user who has only a
    # compiler, and the point is to prove the tarball needs nothing else.
    # Removing pandoc also makes the manual it checks the one that shipped,
    # rather than one regenerated here.
    - name: Install a minimal toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make libbz2-dev zlib1g-dev
        sudo apt-get remove -y pandoc || true
        if command -v pandoc >/dev/null 2>&1 ; then
          echo "::error::pandoc is still on PATH; this job must build without it" >&2
          exit 1
        fi

    - name: Unpack
      run: |
        tarball=$(ls vsearch-*.tar.gz)
        sha256sum -c "${tarball}.sha256"
        tar xzf "${tarball}"

    # The manual has to come out of the tarball ready-made: a user building a
    # release has no pandoc to generate it, and the README promises it is
    # there.
    - name: Check the manual is shipped
      run: |
        cd vsearch-*/
        pages=$(ls man/manpages/vsearch*.1 man/manpages/vsearch*.5 man/manpages/vsearch*.7 | wc -l)
        echo "${pages} manual pages shipped"
        test "${pages}" -gt 0
        test -f NEWS

    # The tarball must carry no development scaffolding: everything
    # .gitattributes marks export-ignore has to be absent, or 'make dist'
    # silently stopped honouring it (it would, if the rule ever went back to
    # 'git ls-files', which does not read that attribute).
    - name: Check the tarball carries no development files
      run: |
        cd vsearch-*/
        status=0
        for path in .github dockerfiles Dockerfile .dockerignore \
                    run_clang_tidy.sh run_legacy_gcc.sh _config.yml \
                    .gitignore .gitattributes ; do
          if [ -e "${path}" ] ; then
            echo "::error::${path} should have been export-ignored" >&2
            status=1
          fi
        done
        exit "${status}"

    # Touching the markdown sources makes them newer than the manual pages
    # generated from them, which is a user's ordinary situation -- git does
    # not preserve mtimes, and nor does unpacking into an existing tree. With
    # no pandoc on PATH the build must still succeed, using the pages the
    # tarball ships, rather than trying to regenerate them and failing.
    - name: Build
      run: |
        cd vsearch-*/
        touch man/index.1.md man/commands/*.md man/formats/*.md man/misc/*.md
        make -j$(nproc) 2>&1 | tee "${RUNNER_TEMP}/build.log"
        exit "${PIPESTATUS[0]}"

    - name: Check that nothing tried to regenerate the manual
      run: |
        count=$(grep -ci 'pandoc\|generate_manpages' "${RUNNER_TEMP}/build.log" || true)
        echo "manual-generation attempts in the build log: ${count}"
        if [ "${count}" != "0" ] ; then
          grep -in 'pandoc\|generate_manpages' "${RUNNER_TEMP}/build.log" >&2
          echo "::error::the tarball tried to rebuild its manual; it is not self-contained" >&2
          exit 1
        fi

    - name: Check the binary
      run: |
        cd vsearch-*/
        version=$(cat VERSION)
        bin/vsearch --version 2>&1 | head -n 1
        bin/vsearch --version 2>&1 | head -n 1 | grep -q "vsearch v${version}_"

  publish:
    name: Attach it to the release
    needs: [dist, verify]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
    - name: Download the tarball
      uses: actions/download-artifact@v7
      with:
        name: source-distribution

    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
           vsearch-*.tar.gz vsearch-*.tar.gz.sha256 \
           --repo "${{ github.repository }}" --clobber
