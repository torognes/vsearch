name: Build and test

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        # python3-yaml, zsh and fish are for the completion checks below
        sudo apt-get install -y libbz2-dev zlib1g-dev python3-yaml zsh fish

    # A bare `make` has to come out at -O3. That is what a reader of
    # README.md gets, and it is the one build nothing else here exercises:
    # every other job pins CFLAGS/CXXFLAGS explicitly, so the default could
    # drift unnoticed. Asking src/Makefile to echo the flags needs no build
    # and cannot pass vacuously -- "make -n | grep" would, because -n prints
    # nothing once the tree is up to date.
    - name: Check the default optimization level
      run: |
        make -C src --no-print-directory print-vs_CXXFLAGS
        make -C src --no-print-directory print-vs_CFLAGS
        make -C src --no-print-directory print-vs_CXXFLAGS | grep -q -- '-O3'
        make -C src --no-print-directory print-vs_CFLAGS   | grep -q -- '-O3'

    - name: Build
      run: |
        make clean
        make -j$(nproc)
        bin/vsearch -v

    # Checks the completion spec against the option tables in src/cli.cc, so
    # this fires on a change to either side -- the spec drifting is the usual
    # case, but a new or renamed option in cli.cc is what makes it drift.
    # STRICT=1 turns a missing python3, PyYAML, zsh or fish into a failure:
    # without it they are skipped with a notice, which here would quietly
    # turn the whole check into a pass.
    - name: Check the shell completion scripts
      run: STRICT=1 make -C completion check

    - name: Test the library API
      run: |
        make -C src libvsearch.a -j$(nproc)
        make -C api_examples test

    - name: Run tests
      run: |
        export PATH=$PWD/bin:$PATH
        git clone --depth 1 --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/vsearch-tests
        cd vsearch-tests
        bash ./run_all_tests.sh


  library-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libbz2-dev zlib1g-dev

    # SANITIZE=1 adds -fsanitize=undefined,address -fno-omit-frame-pointer to
    # both the compile and the link lines; CFLAGS/CXXFLAGS are appended after
    # the flavour's own flags, so -O1 here overrides the default -O3.
    - name: Build libvsearch.a with AddressSanitizer + UBSan
      run: |
        make -C src libvsearch.a SANITIZE=1 CFLAGS="-O1" CXXFLAGS="-O1" -j$(nproc)

    - name: Run the library API examples under the sanitizers
      run: |
        export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
        export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
        make -C api_examples SANITIZE=1 test


  linux-gcc-legacy:
    # Guard the oldest supported compilers. Their images are long-EOL Debian
    # releases -- jessie for GCC 4.9, wheezy for GCC 4.8 -- whose glibc (2.19
    # and 2.13) predates the 2.28 that the Node.js runtime behind every
    # JavaScript action needs, so a `container:` job could not so much as run
    # actions/checkout. Driving the build with `docker run` from an ordinary
    # runner keeps every action on the host and asks the container for nothing
    # but a compiler: the images already ship zlib.h and bzlib.h, so no package
    # is installed and the container needs no network (jessie and wheezy are
    # served from archive.debian.org now, and getting apt-get to talk to it is
    # a job in itself). pandoc is absent, so the manual is not built; that is
    # expected. These images also guard the oldest supported GNU make -- 3.81
    # on wheezy, 4.0 on jessie -- which matters now that make is the build
    # system rather than autoconf's output.
    #
    # The test suite then runs on the host against the binary the container
    # built -- a binary linked against glibc 2.19 runs on the runner's much
    # newer one -- because rejecting new code is only half of what an old
    # compiler can do to us. The other half is miscompiling it, and only
    # running the tests catches that.
    #
    # run_legacy_gcc.sh is the local equivalent of this job.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # "4.8.5", not "4.8", and the patch version is load-bearing. The
        # floating gcc:4.8 tag was published as a Docker image manifest v2
        # schema 1, a format Docker 29 refuses to pull by default and will
        # drop entirely; the pull fails with exit 125 before the container
        # ever starts. gcc:4.8.5 is the same image -- GCC 4.8.5, GNU make
        # 3.81, Debian 7 wheezy -- published as schema 2. gcc:4.9 is already
        # a v2 manifest list and needs no pin. Do not "tidy" this back.
        gcc: [ "4.8.5", "4.9" ]

    name: linux-gcc-legacy (GCC ${{ matrix.gcc }})

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build with GCC ${{ matrix.gcc }}
      run: |
        docker run --rm -v "$PWD":/w -w /w gcc:${{ matrix.gcc }} bash -c '
          set -e
          g++ --version | head -1
          make --version | head -1
          make clean
          make -j$(nproc)
          bin/vsearch -v
        '
        # The container runs as root, so everything it just wrote is
        # root-owned. Hand the workspace back before the host-side steps
        # touch it.
        sudo chown -R "$(id -u):$(id -g)" .

    - name: Run tests
      run: |
        export PATH=$PWD/bin:$PATH
        git clone --depth 1 --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/vsearch-tests
        cd vsearch-tests
        bash ./run_all_tests.sh


  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-aarch64,  host: aarch64-linux-gnu,      pkgs: "g++-aarch64-linux-gnu libsimde-dev" }
          - { name: linux-mips64el, host: mips64el-linux-gnuabi64, pkgs: "g++-mips64el-linux-gnuabi64 libsimde-dev" }
          - { name: linux-ppc64le,  host: powerpc64le-linux-gnu,  pkgs: "g++-powerpc64le-linux-gnu libsimde-dev" }
          - { name: linux-riscv64,  host: riscv64-linux-gnu,      pkgs: "g++-riscv64-linux-gnu libsimde-dev" }

    name: cross-build (${{ matrix.target.name }})

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libbz2-dev zlib1g-dev ${{ matrix.target.pkgs }}

    # Naming the compiler is the whole cross-compilation recipe: src/Makefile
    # takes the target from `$(CXX) -dumpmachine` and derives CC, ar and
    # ranlib from it.
    - name: Build for ${{ matrix.target.name }}
      run: |
        make clean
        make CXX=${{ matrix.target.host }}-g++ -j$(nproc)

    # vsearch has two C translation units, and make's built-in default for CC
    # is the *host* compiler. Mixing its objects into a cross link is accepted
    # silently by the linker, so assert that the whole tree is one target.
    - name: Assert the build targets ${{ matrix.target.name }}
      run: |
        sh ci/check-object-formats.sh \
          "src/build/$(${{ matrix.target.host }}-g++ -dumpmachine)-release" \
          ${{ matrix.target.host }}-g++


  cross-build-windows:
    # Windows is built here the way release-binaries.yml builds it -- in
    # debian:11, on the posix threading model -- instead of alongside the
    # other cross targets above, because it is the one target whose release
    # toolchain differs from the runner's in kind rather than in age.
    # bullseye's mingw-w64 is GCC 10, whose win32 libstdc++ has no gthreads,
    # so <thread>, <mutex> and <condition_variable> are empty headers there
    # and the model a build picks decides whether it compiles at all.
    #
    # ubuntu-latest made that concrete: its default mingw-w64 moved from
    # 13-posix to 13-win32, and because GCC 13 implements all three on native
    # Win32 primitives the build kept passing -- on a compiler and a
    # threading model no release has ever shipped. Pinning the job to the
    # release container removes the question rather than tracking it.
    #
    # The other cross targets stay on the runner: they differ from the
    # release only in compiler version, and that axis is already guarded,
    # far below bullseye's GCC 10, by linux-gcc-legacy.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build for windows-x86_64
      run: |
        docker run --rm -v "$PWD":/w -w /w debian:11 bash -c '
          set -eu
          # bullseye is EOL: apt-get update still succeeds because the indices
          # are served, but the bullseye-security pool is already 404. The
          # image ships snapshot.debian.org lines commented out for exactly
          # this case. Same dance, and the same reason, as release-binaries.yml.
          sed -i "s|^# deb http://snapshot|deb http://snapshot|" /etc/apt/sources.list
          sed -i "s|^deb http://deb.debian.org|# deb http://deb.debian.org|" /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update -qq
          apt-get install -y -qq g++ make mingw-w64 libz-mingw-w64-dev
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-g++ -v 2>&1 | grep -E "Thread model|gcc version"
          # Fail in two seconds with a readable message rather than three
          # minutes into the build with two hundred lines of template noise.
          x86_64-w64-mingw32-g++ -v 2>&1 | grep -q "Thread model: posix" || {
            echo "::error::mingw-w64 is on the win32 threading model; C++11 <thread> is unavailable" >&2
            exit 1
          }
          make clean
          make CXX=x86_64-w64-mingw32-g++ -j$(nproc)
          sh ci/check-object-formats.sh \
            src/build/x86_64-w64-mingw32-release x86_64-w64-mingw32-g++
        '
        # The container runs as root; hand the workspace back.
        sudo chown -R "$(id -u):$(id -g)" .


  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      run: |
        make clean
        make -j$(sysctl -n hw.ncpu)
        bin/vsearch -v

    - name: Run tests
      run: |
        export PATH=$PWD/bin:$PATH
        git clone --depth 1 --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/vsearch-tests
        cd vsearch-tests
        bash ./run_all_tests.sh


  macos-x86_64:
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      run: |
        make clean
        make -j$(sysctl -n hw.ncpu)
        bin/vsearch -v

    - name: Run tests
      run: |
        export PATH=$PWD/bin:$PATH
        git clone --depth 1 --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/vsearch-tests
        cd vsearch-tests
        bash ./run_all_tests.sh


  freebsd-x86_64:
    runs-on: ubuntu-latest
    # A single step (vmactions) must fit VM boot + pkg install + build + the
    # test suite (capped at suite_timeout = 720 s below) + the post-run rsync
    # copyback that brings test.log back to the host. vmactions only copies the
    # workspace back if the "run" script returns cleanly (index.js runs copyback
    # *after* the run step, so a job-timeout kill skips it) -- when this budget
    # is too tight the step is killed mid-run/mid-copyback and the test.log
    # artifact is never produced. 40 min leaves headroom for the copyback.
    timeout-minutes: 40

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # Clone the test suite on the Ubuntu host, where the network is reliable,
    # rather than inside the FreeBSD VM. An in-VM `git clone` intermittently
    # stalls on the guest's network and, with no git timeout, hangs until the
    # 20-minute job limit. vmactions syncs the workspace into the VM, so the
    # cloned directory is available there.
    - name: Clone the test suite (on the host, not the FreeBSD VM)
      run: |
        git clone --depth 1 --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/vsearch-tests

    - name: Build and test on FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg update -f
          pkg install -y gmake bash git bzip2
          pw useradd -n runner -m -s /usr/local/bin/bash
          # Experiment: with fdescfs on /dev/fd, bash may spell <() as
          # /dev/fd/N (as on Linux and macOS) instead of a named FIFO.
          mount -t fdescfs fdesc /dev/fd
        run: |
          # Experiment: prints /dev/fd/N or a named-FIFO path (see prepare).
          bash -c 'echo <(:)'
          # gmake, not make: the Makefiles use GNU make constructs and
          # FreeBSD's make is BSD make. There is no g++ here either -- the
          # base compiler is clang, installed as c++ and cc -- and
          # src/Makefile falls back to it rather than failing on make's
          # built-in default of g++.
          echo "========== Building vsearch =========="
          gmake clean
          gmake -j$(sysctl -n hw.ncpu)
          bin/vsearch -v
          echo "========== Build complete =========="

          # vsearch-tests was cloned on the host (previous step); vmactions
          # syncs the workspace into the VM, so it should be present here.
          # Fail fast with a clear message (not a hang) if the sync did not
          # bring it in.
          echo "========== Checking for the test suite in the VM =========="
          if [ ! -d vsearch-tests/scripts ]; then
            echo "ERROR: vsearch-tests was not synced into the VM. Workspace contents:"
            ls -la
            exit 1
          fi
          echo "Found vsearch-tests ($(ls vsearch-tests/scripts | wc -l) test scripts)."
          chown -R runner vsearch-tests

          # The suite runs ~7,700 tests, each printing a result line.
          # Streaming that volume over the vmactions SSH channel wedges
          # the FreeBSD guest after a few minutes (it stops responding at
          # a random point). Run the suite into a log file inside the VM
          # instead, then surface a bounded summary so CI still reports
          # failures. root bypasses POSIX permission checks, so the "file
          # not readable/writable" tests need an unprivileged user.
          #
          # The suite runs in the background under its own timeout (so a hung
          # test cannot eat the whole 20-minute job budget and skip the summary
          # below). A watcher polls the log once a second but prints only when
          # the last non-blank line changes — near-real-time progress without
          # flooding the vmactions SSH channel (high output volume wedges the
          # guest, which is why the suite output is redirected to a file in the
          # first place). After ~30 s with no new output it dumps the test
          # process tree with each process's state and wait channel (wchan).
          #
          # On FreeBSD the suite reaches its end but teardown stalls: <() is a
          # real named FIFO there, so a negative test that fed vsearch an input
          # via <() leaves the FIFO writer blocked in fifoow once vsearch
          # rejects the options *before opening* the input (no reader ever
          # appears). On Linux <() is a /dev/fd pipe, so this never happens. The
          # watcher reaps ONLY those fifoow-blocked writers — a targeted kill by
          # pid, never a broad `pkill -U runner`, which also kills the vmactions
          # SSH shell (ssh exits 143) and skips copyback — which lets the suite
          # process exit. Pass/fail is then decided by the SUMMARY line and the
          # FAIL lines in test.log (see the block after the watcher); the
          # teardown stall is not a failure, because the suite has printed its
          # SUMMARY by then. A stall with no fifoow writers is treated as a
          # genuine hang and fails.
          #
          # timeout -f (--foreground): without it, FreeBSD's timeout(1) makes
          # itself the reaper of the suite's descendants and waits for all of
          # them, so leftover fifoow writers keep it (and suite_pid) alive long
          # after run_all_tests.sh has exited. With -f, it returns as soon as
          # the suite does, and still stops the suite after suite_timeout.
          echo "========== Running tests... =========="
          suite_timeout=720
          rm -f vsearch-tests/test.log
          su -m runner -c "cd vsearch-tests && PATH=$PWD/bin:\$PATH timeout -f -k 30 ${suite_timeout} bash ./run_all_tests.sh > test.log 2>&1" </dev/null >/dev/null 2>&1 &
          suite_pid=$!
          last_sig=""
          stall=0
          reaped=0
          genuine_hang=0
          abandoned=0
          while kill -0 "$suite_pid" 2>/dev/null; do
            sig=$(tail -n 20 vsearch-tests/test.log 2>/dev/null | grep -v '^[[:space:]]*$' | tail -n 1)
            if [ "$sig" != "$last_sig" ]; then
              echo "[$(date -u +%H:%M:%S)] $sig"
              last_sig="$sig"
              stall=0
            else
              stall=$((stall + 1))
              if [ "$stall" -ge 30 ]; then
                echo "[$(date -u +%H:%M:%S)] no new test output for ${stall}s; test process tree (pid ppid stat wchan command):"
                ps -U runner -o pid,ppid,stat,wchan,command 2>/dev/null | head -n 30 | sed 's/^/    /'
                # Reap ONLY the fifoow-blocked <() writers (see the note above):
                # a targeted kill by pid, never a broad pkill. This lets the
                # suite process unwind and exit. If it does not, the suite was
                # not in teardown and the log is partial -- see "abandoned".
                fifoow_pids=$(ps -U runner -o pid,wchan 2>/dev/null | awk '$2 == "fifoow" { print $1 }')
                if [ -n "$fifoow_pids" ]; then
                  echo "[$(date -u +%H:%M:%S)] reaping orphaned fifoow <() writers: $(echo $fifoow_pids | tr '\n' ' ')"
                  # `|| true`: under `set -eu` a kill that races a writer
                  # already gone would otherwise abort the whole script.
                  echo "$fifoow_pids" | xargs kill 2>/dev/null || true
                  reaped=1
                else
                  # Stalled but nothing is blocked in fifoow: not the known
                  # teardown artifact, so treat it as a genuine hang and fail.
                  echo "[$(date -u +%H:%M:%S)] stall with no fifoow writers — treating as a genuine hang."
                  genuine_hang=1
                fi
                break
              fi
            fi
            sleep 1
          done
          # Give the (reaped) suite a moment to unwind, but never block forever
          # on it: if it is still alive after the grace period, abandon it to the
          # VM teardown — the background job is detached from the SSH stdio so the
          # session still closes cleanly and vmactions runs copyback.
          for _ in $(seq 1 20); do kill -0 "$suite_pid" 2>/dev/null || break; sleep 1; done
          # vmactions runs this script under `set -eu`, so any status-bearing
          # command must be neutralized with `|| true`: on a red suite, a bare
          # `wait` returns the suite's non-zero status and aborts the script
          # right here — skipping the FAIL summary, test.status, and the
          # `exit 0` that lets vmactions copy test.log back (which is why red
          # runs used to lose their test.log artifact).
          if kill -0 "$suite_pid" 2>/dev/null; then
            echo "suite process still alive after reap; abandoning it to VM teardown."
            abandoned=1
          else
            wait "$suite_pid" 2>/dev/null || true
          fi
          echo "========== Tests finished =========="
          # Pass/fail = the suite ran to completion AND no test reported FAIL.
          #
          # "Ran to completion" has to be checked, not assumed. run_all_tests.sh
          # prints exactly one SUMMARY line from an EXIT trap, so a run that
          # finished always has one -- including a red run (SUMMARY: ABORTED)
          # and a run whose *teardown* then stalls, which is why the stall is
          # still not a failure. A run that is cut short mid-suite has neither a
          # SUMMARY nor a FAIL line, and used to be reported GREEN on the FAIL
          # check alone. That is not hypothetical: on 2026-09-21 a 30 s stall
          # during orient made the watcher reap and break, the grace period
          # expired on a suite that was still running, and the job passed on a
          # two-thirds-complete log (6403 PASS, no SUMMARY) -- hiding a test
          # that fails on FreeBSD and would equally have hidden a regression.
          echo "===== FAIL lines ====="
          if grep -E 'FAIL' vsearch-tests/test.log; then
            status=1
          else
            echo "(none)"
            status=0
          fi
          if ! grep -q 'SUMMARY: OK' vsearch-tests/test.log; then
            echo "!!! The suite did not run to completion: no 'SUMMARY: OK' line."
            echo "    last log line: $(tail -n 1 vsearch-tests/test.log 2>/dev/null)"
            status=1
          fi
          if [ "$abandoned" -eq 1 ]; then
            # The reap is meant to unblock a suite that has already finished its
            # tests. If the suite is still alive after the grace period it was
            # not in teardown, so whatever it had written is partial.
            echo "!!! The suite was still running when it was abandoned after the reap."
            status=1
          fi
          if [ "$genuine_hang" -eq 1 ]; then
            echo "!!! Genuine hang detected (stall with no fifoow writers)."
            status=124
          fi
          echo "===== last 60 lines of test.log ====="
          tail -n 60 vsearch-tests/test.log
          # Record the status and exit 0 so vmactions runs its copyback: it SKIPS
          # copyback when the run script exits non-zero, which is why the test.log
          # artifact kept coming up empty. The host-side "Report" step below reads
          # test.status and turns it back into the job's pass/fail.
          echo "$status" > vsearch-tests/test.status
          exit 0

    # vmactions copies the workspace back to the host, so the full in-VM test
    # log (all ~7,700 result lines, not just the tail above) is available here.
    # Upload it for offline inspection. Runs even when the suite fails.
    - name: Upload FreeBSD test log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: freebsd-test-log
        path: vsearch-tests/test.log
        if-no-files-found: warn

    # The VM script exits 0 so vmactions copies test.log / test.status back to
    # the host; the real suite status is recorded in test.status. Re-assert it
    # here so the job's pass/fail reflects the actual result.
    - name: Report FreeBSD test result
      if: always()
      run: |
        status=$(cat vsearch-tests/test.status 2>/dev/null || echo 1)
        echo "FreeBSD test suite exit status: ${status}"
        exit "${status}"
