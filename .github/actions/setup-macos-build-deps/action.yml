name: Set up macOS build dependencies
description: >
  Put autoconf and automake on PATH without letting Homebrew upgrade anything
  that is already installed, and quieten the runner's pre-tapped taps. Used by
  every macOS job in build-and-test.yml, which all ran an identical copy of
  this script before.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # "brew install" runs an implicit "brew update" of its own unless
        # this is set, which would undo the whole point of the step below:
        # a refreshed formula index marks every preinstalled formula
        # outdated, and installing a tool then upgrades its outdated
        # dependencies -- on Intel, with no bottles any more, by compiling
        # them. That is the 9 min 46 s failure of 2026-09-03, and it is
        # reachable again now that the images ship neither autoconf nor
        # automake and the install path is the common one.
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        # ./autogen.sh runs autoreconf, so this job needs autoconf and
        # automake, and nothing else. configure.ac asks for very little of
        # them (AC_PREREQ 2.63, AM_INIT_AUTOMAKE with no version, no libtool
        # and no third-party macros), so whatever the runner image ships is
        # good enough: install one only when it is genuinely absent, and do
        # not run "brew update" at all.
        #
        # That is deliberate, not laziness. Homebrew 6.0 moved macOS Intel
        # x86_64 to tier 3 in September 2026: no CI, and no bottles built for
        # the platform any more. "brew update" refreshes the formula index,
        # every preinstalled formula then counts as outdated, and
        # "brew install" upgrades an outdated formula -- which on Intel, with
        # no bottle to fetch, means compiling it. That is what broke this job
        # on 2026-09-03: nine minutes and forty-six seconds inside this step,
        # then a failure, while the arm64 job did the same install from
        # bottles in eighty seconds. Touching nothing that is already present
        # keeps the step off that path on both runners.
        #
        # aws/tap, azure/bicep and hashicorp/tap are pre-tapped on the GitHub
        # macOS runner images and make brew noisy; hashicorp/tap now makes it
        # print a hard error as it scans formulae ("hashicorp/tap/vagrant:
        # formula requires at least a URL"). We use nothing from them, so
        # remove them before installing.
        #
        # That removal is housekeeping, not a prerequisite: nothing in the
        # loop below may fail the step, only "brew install" may. It could,
        # and that is the 2026-09-06 failure: a tap that still has one of
        # its own formulae installed refuses to untap and exits 1, and
        # "brew untap hashicorp/tap" met hashicorp/tap/packer -- new on the
        # image -- and took the whole job down with it. So a tap's installed
        # formulae and casks are uninstalled first, and they are queried
        # rather than named (bicep from azure/bicep was named here, before
        # packer appeared next to it), with --force behind that as a last
        # resort: it downgrades that refusal to a warning. Each removal
        # stays quiet and non-fatal on a future image that no longer has
        # these taps/formulae, as before. We do NOT silence stderr of the
        # actual operations: hiding it is what masked an earlier failure.
        missing=()
        for tool in autoconf automake ; do
          if ! command -v "$tool" >/dev/null 2>&1 ; then
            missing+=("$tool")
          fi
        done

        if [ "${#missing[@]}" -gt 0 ] ; then
          echo "installing: ${missing[*]}"
          for tap in aws/tap azure/bicep hashicorp/tap ; do
            if ! brew tap | grep -qx "$tap" ; then
              continue
            fi
            for kind in formula cask ; do
              installed=()
              # grep exits 1 when the tap has nothing installed
              while IFS= read -r package ; do
                installed+=("$package")
              done < <(brew list "--$kind" --full-name | grep "^$tap/" || true)
              if [ "${#installed[@]}" -gt 0 ] ; then
                brew uninstall "--$kind" "${installed[@]}" || true
              fi
            done
            brew untap "$tap" || brew untap --force "$tap" || true
          done
          brew install "${missing[@]}"
        fi

        # both must now be on PATH: fail here, with versions in the log,
        # rather than inside autoreconf
        autoconf --version | head -n 1
        automake --version | head -n 1
